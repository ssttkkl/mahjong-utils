name: Verify Maven 0.8.0 artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40112639939
          pattern: maven-*
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/verify-maven-080.py
